name: Validate Compose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate core compose
        run: docker compose -f compose/docker-compose.yml config -q

      - name: Validate coding overlay
        run: docker compose -f compose/docker-compose.yml -f compose/docker-compose.coding.yml config -q

      - name: Validate productivity overlay
        run: docker compose -f compose/docker-compose.yml -f compose/docker-compose.productivity.yml config -q

      - name: Validate vibecoding overlay
        run: docker compose -f compose/docker-compose.yml -f compose/docker-compose.vibecoding.yml config -q

      - name: Validate daily overlay
        run: docker compose -f compose/docker-compose.yml -f compose/docker-compose.daily.yml config -q

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
          severity: warning
