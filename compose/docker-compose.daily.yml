services:
  # ===========================================================================
  # n8n - Workflow automation with AI agent support
  # 1500+ integrations, visual workflow builder, AI nodes
  # ===========================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # Khoj - AI personal assistant with memory
  # Indexes documents, provides semantic search, answers from your knowledge base
  # ===========================================================================
  khoj:
    image: khoj/khoj:latest
    container_name: khoj
    restart: unless-stopped
    ports:
      - "${KHOJ_PORT:-42110}:42110"
    environment:
      KHOJ_ADMIN_EMAIL: ${KHOJ_ADMIN_EMAIL:-admin@example.com}
      KHOJ_ADMIN_PASSWORD: ${KHOJ_ADMIN_PASSWORD:-change-me-now}
    volumes:
      - khoj-data:/data
    networks:
      - data
      - inference
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:42110"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # LibreChat - Multi-model AI chat platform
  # Supports OpenAI, Anthropic, Ollama, Gemini, MCP, agents, code interpreter
  # ===========================================================================
  librechat-api:
    image: ghcr.io/danny-avila/librechat-api:latest
    container_name: librechat-api
    restart: unless-stopped
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    environment:
      MONGO_URL: mongodb://librechat-mongo:27017/LibreChat
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:-change-this-to-a-random-32-char-string}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:-change-this-to-a-random-16-char-string}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:-change-this-to-a-random-secret}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:-change-this-to-another-random-secret}
      APP_TITLE: "Local AI Chat"
    volumes:
      - librechat-images:/app/client/public/images
    networks:
      - data
      - inference
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  librechat-mongo:
    image: mongo:7
    container_name: librechat-mongo
    restart: unless-stopped
    volumes:
      - librechat-mongo:/data/db
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  n8n-data:
  khoj-data:
  librechat-images:
  librechat-mongo:
