services:
  paperless-broker:
    image: redis:7-alpine
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - paperless-redis:/data
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  paperless-db:
    image: postgres:17-alpine
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - paperless-db:/var/lib/postgresql/data
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - FOWNER
      - CHOWN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 30s
      timeout: 5s
      retries: 5

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
    ports:
      - "${PAPERLESS_PORT:-8000}:8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:-change-me-now}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-change-this-to-a-long-random-secret}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-change-me-now}
      PAPERLESS_URL: http://localhost:${PAPERLESS_PORT:-8000}
      PAPERLESS_TIME_ZONE: ${TZ:-Asia/Kolkata}
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  blinko:
    image: blinkoai/blinko:latest
    container_name: blinko
    restart: unless-stopped
    ports:
      - "${BLINKO_PORT:-1111}:1111"
    volumes:
      - blinko:/app/data
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1111"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  karakeep:
    image: ghcr.io/karakeep-app/karakeep:latest
    container_name: karakeep
    restart: unless-stopped
    ports:
      - "${KARAKEEP_PORT:-3002}:3000"
    volumes:
      - karakeep:/data
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  pulse:
    image: lucaslorentz/pulse:latest
    container_name: pulse
    restart: unless-stopped
    ports:
      - "${PULSE_PORT:-7655}:7655"
    volumes:
      - pulse:/app/data
      # Required: Pulse monitors Docker containers via the socket API.
      # This is read-only; Pulse cannot modify containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7655"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  open-notebook:
    image: ghcr.io/lfnovo/open-notebook:latest
    container_name: open-notebook
    restart: unless-stopped
    ports:
      - "${OPEN_NOTEBOOK_PORT:-8502}:8502"
    volumes:
      - open-notebook:/app/data
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8502"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  data:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  paperless-redis:
  paperless-db:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  blinko:
  karakeep:
  pulse:
  open-notebook:
